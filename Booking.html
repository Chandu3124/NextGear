<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextGear | Book a Session</title>
  <link rel="icon" type="image/png" sizes="184x184" href="logo-light.png">
  <link rel="stylesheet" href="Booking.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="top-actions">
    <button class="circle-btn rtl-text-btn" id="rtlToggle" type="button" aria-label="Toggle RTL">
      RTL
    </button>

    <button class="circle-btn" id="themeToggle" type="button" aria-label="Toggle dark mode">
      <svg class="btn-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79Z" />
      </svg>

      <svg class="btn-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"></path>
      </svg>
    </button>
  </div>

  <section class="booking-page">
    <div class="container">
      <div class="booking-card">
        <div class="brand-row">
          <a href="index.html" class="logo" aria-label="NextGear home">
            <img
              id="siteLogo"
              src="logo-light.png"
              alt="NextGear logo"
              data-light-logo="logo-light.png"
              data-dark-logo="logo-dark.png"
            />
            <h2>NEXT<span>GEAR</span></h2>
          </a>
        </div>

        <h1>Book a Session</h1>
        <p class="intro full-intro">
          Book your preferred session quickly using the form below. Enter your contact details, select the type of session you need, choose a suitable date and time, and share any additional information so the session can be prepared properly before confirmation.
        </p>

        <form class="booking-form">
          <div class="form-grid">
            <div class="field">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" />
            </div>

            <div class="field">
              <label for="phoneNumber">Phone Number</label>
              <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number" />
            </div>

            <div class="field">
              <label for="emailAddress">Email Address</label>
              <input type="email" id="emailAddress" name="emailAddress" placeholder="Enter your email address" />
            </div>

            <div class="field">
              <label for="sessionType">Session Type</label>
              <select id="sessionType" name="sessionType">
                <option value="">Select session type</option>
                <option value="consultation">Consultation</option>
                <option value="trial">Trial Session</option>
                <option value="assessment">Assessment</option>
                <option value="support">Support Session</option>
              </select>
            </div>

            <div class="field">
              <label for="sessionDate">Preferred Date</label>
              <input type="date" id="sessionDate" name="sessionDate" />
            </div>

            <div class="field">
              <label for="sessionTime">Preferred Time</label>
              <input type="time" id="sessionTime" name="sessionTime" />
            </div>
          </div>

          <div class="field">
            <label for="message">Additional Details</label>
            <textarea id="message" name="message" rows="6" placeholder="Share your requirement, preferred location, or any other useful details"></textarea>
          </div>

          <button class="submit-btn" type="submit">Book Session</button>
        </form>
      </div>
    </div>
  </section>

  <script>
    const themeToggle = document.getElementById("themeToggle");
    const rtlToggle = document.getElementById("rtlToggle");
    const siteLogo = document.getElementById("siteLogo");

    function updateLogoByTheme() {
      if (!siteLogo) return;

      const isDark = document.body.classList.contains("dark");
      const lightLogo = siteLogo.dataset.lightLogo;
      const darkLogo = siteLogo.dataset.darkLogo;

      if (!lightLogo || !darkLogo) return;

      siteLogo.src = isDark ? darkLogo : lightLogo;
    }

    function setTheme(theme) {
      const isDark = theme === "dark";
      document.body.classList.toggle("dark", isDark);
      updateLogoByTheme();

      if (themeToggle) {
        themeToggle.innerHTML = isDark
          ? '<svg class="btn-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"></path></svg>'
          : '<svg class="btn-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79Z" /></svg>';
      }

      localStorage.setItem("theme", theme);
    }

    function setDirection(direction) {
      const isRTL = direction === "rtl";
      document.documentElement.setAttribute("dir", direction);

      if (rtlToggle) {
        rtlToggle.textContent = isRTL ? "LTR" : "RTL";
      }

      localStorage.setItem("direction", direction);
    }

    const savedTheme =
      localStorage.getItem("theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

    const savedDirection = localStorage.getItem("direction") || "ltr";

    setTheme(savedTheme);
    setDirection(savedDirection);

    themeToggle?.addEventListener("click", () => {
      const nextTheme = document.body.classList.contains("dark") ? "light" : "dark";
      setTheme(nextTheme);
    });

    rtlToggle?.addEventListener("click", () => {
      const nextDir =
        document.documentElement.getAttribute("dir") === "rtl" ? "ltr" : "rtl";
      setDirection(nextDir);
    });
  </script>
</body>
</html>
