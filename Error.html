<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | NextGear</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#ff7900;
      --bg:#f6f9fd;
      --card:#ffffff;
      --text:#0d2747;
      --muted:#5f7086;
      --border:#e4e7ea;
      --shadow:0 18px 45px rgba(8,28,58,.10);
      --toggle-bg:#ffffff;
      --toggle-text:#081c3a;
    }

    body.dark{
      --bg:#050505;
      --card:#000000;
      --text:#ffffff;
      --muted:#d1d5db;
      --border:rgba(255,255,255,.12);
      --shadow:0 18px 45px rgba(0,0,0,.40);
      --toggle-bg:#111827;
      --toggle-text:#ffffff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:var(--bg);
      color:var(--text);
      transition:background .35s ease,color .35s ease;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      display:block;
      max-width:100%;
      height:auto;
    }

    button{
      font:inherit;
      border:none;
      background:none;
      cursor:pointer;
    }

    .page{
      min-height:100dvh;
      position:relative;
      display:grid;
      place-items:center;
      padding:20px;
    }

    .top-actions{
      position:absolute;
      top:20px;
      right:20px;
      display:flex;
      align-items:center;
      gap:10px;
      z-index:5;
    }

    .icon-btn{
      width:46px;
      height:46px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--toggle-bg);
      color:var(--toggle-text);
      border:1px solid rgba(0,0,0,.06);
      transition:all .3s ease;
      box-shadow:0 8px 20px rgba(0,0,0,.10);
    }

    body.dark .icon-btn{
      border-color:rgba(255,255,255,.10);
      box-shadow:0 8px 20px rgba(0,0,0,.28);
    }

    .icon-btn:hover{
      background:var(--primary);
      color:#fff;
      transform:translateY(-2px);
    }

    .icon-btn svg{
      width:19px;
      height:19px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .rtl-text-btn{
      width:auto;
      min-width:46px;
      padding:0 14px;
      font-size:13px;
      font-weight:700;
      letter-spacing:.4px;
    }

    .card{
      width:min(100%, 520px);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:34px 28px;
      text-align:center;
      transition:background .35s ease,border-color .35s ease,color .35s ease;
    }

    .logo{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-bottom:22px;
    }

    .logo img{
      width:56px;
      object-fit:contain;
    }

    .logo h1{
      font-size:24px;
      font-weight:800;
      line-height:1;
      color:var(--text);
    }

    .logo h1 span{
      color:var(--primary);
    }

    .code{
      font-size:72px;
      font-weight:800;
      line-height:1;
      color:var(--primary);
      margin-bottom:14px;
    }

    .card h2{
      font-size:28px;
      margin-bottom:12px;
      color:var(--text);
    }

    .card p{
      font-size:15px;
      line-height:1.8;
      color:var(--muted);
      max-width:400px;
      margin:0 auto 24px;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      min-height:46px;
      padding:12px 20px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:600;
      transition:all .3s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
      border:1px solid var(--primary);
    }

    .btn-primary:hover{
      background:#e86d00;
      border-color:#e86d00;
    }

    .btn-secondary{
      background:transparent;
      color:var(--text);
      border:1px solid var(--border);
    }

    .btn-secondary:hover{
      background:rgba(0,0,0,.04);
    }

    body.dark .btn-secondary:hover{
      background:rgba(255,255,255,.08);
    }

    a:focus-visible,
    button:focus-visible{
      outline:2px solid var(--primary);
      outline-offset:3px;
    }

    html[dir="rtl"] .top-actions{
      right:auto;
      left:20px;
      flex-direction:row-reverse;
    }

    @media (max-width:540px){
      .page{
        padding:16px;
      }

      .top-actions{
        top:16px;
        right:16px;
        gap:8px;
      }

      html[dir="rtl"] .top-actions{
        left:16px;
      }

      .icon-btn{
        width:42px;
        height:42px;
      }

      .rtl-text-btn{
        min-width:42px;
        padding:0 12px;
        font-size:12px;
      }

      .icon-btn svg{
        width:17px;
        height:17px;
      }

      .card{
        padding:28px 20px;
        border-radius:20px;
      }

      .logo img{
        width:46px;
      }

      .logo h1{
        font-size:20px;
      }

      .code{
        font-size:58px;
      }

      .card h2{
        font-size:24px;
      }

      .card p{
        font-size:14px;
        margin-bottom:20px;
      }

      .btn{
        min-height:44px;
        padding:11px 18px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top-actions">
      <button
        type="button"
        id="rtlToggle"
        class="icon-btn rtl-text-btn"
        aria-label="Switch to right to left layout"
        aria-pressed="false"
        title="Toggle RTL"
      >
        RTL
      </button>

      <button
        type="button"
        id="themeToggle"
        class="icon-btn"
        aria-label="Switch to dark mode"
        aria-pressed="false"
        title="Toggle theme"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <section class="card" aria-labelledby="errorTitle">
      <a href="index.html" class="logo" aria-label="NextGear home">
        <img
          id="siteLogo"
          src="logo-light.png"
          alt="NextGear logo"
          data-light-logo="logo-light.png"
          data-dark-logo="logo-dark.png"
        />
        <h1>NEXT<span>GEAR</span></h1>
      </a>

      <div class="code">404</div>
      <h2 id="errorTitle">Page Not Found</h2>
      <p>
        Sorry, the page you are looking for doesn’t exist or may have been moved.
      </p>

      <div class="actions">
        <a href="index.html" class="btn btn-primary">Go Home</a>
        <a href="Contact.html" class="btn btn-secondary">Contact Us</a>
      </div>
    </section>
  </main>

  <script>
    const memoryStore = {
      theme: null,
      direction: null
    };

    const safeStorage = {
      get(key) {
        try {
          return window.localStorage.getItem(key);
        } catch (e) {
          return memoryStore[key] || null;
        }
      },
      set(key, value) {
        try {
          window.localStorage.setItem(key, value);
        } catch (e) {
          memoryStore[key] = value;
        }
      }
    };

    const body = document.body;
    const html = document.documentElement;
    const themeBtn = document.getElementById("themeToggle");
    const rtlBtn = document.getElementById("rtlToggle");
    const siteLogo = document.getElementById("siteLogo");

    function updateLogoByTheme(isDark) {
      if (!siteLogo) return;
      const lightLogo = siteLogo.dataset.lightLogo;
      const darkLogo = siteLogo.dataset.darkLogo;
      if (!lightLogo || !darkLogo) return;
      siteLogo.src = isDark ? darkLogo : lightLogo;
    }

    function setTheme(theme) {
      const isDark = theme === "dark";
      body.classList.toggle("dark", isDark);
      updateLogoByTheme(isDark);

      if (themeBtn) {
        themeBtn.setAttribute(
          "aria-label",
          isDark ? "Switch to light mode" : "Switch to dark mode"
        );
        themeBtn.setAttribute("aria-pressed", String(isDark));
        themeBtn.innerHTML = isDark
          ? `<svg viewBox="0 0 24 24" aria-hidden="true">
               <circle cx="12" cy="12" r="5"></circle>
               <path d="M12 1v2"></path>
               <path d="M12 21v2"></path>
               <path d="M4.22 4.22l1.42 1.42"></path>
               <path d="M18.36 18.36l1.42 1.42"></path>
               <path d="M1 12h2"></path>
               <path d="M21 12h2"></path>
               <path d="M4.22 19.78l1.42-1.42"></path>
               <path d="M18.36 5.64l1.42-1.42"></path>
             </svg>`
          : `<svg viewBox="0 0 24 24" aria-hidden="true">
               <path d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79z"></path>
             </svg>`;
      }
    }

    function setDirection(direction) {
      const isRTL = direction === "rtl";
      html.setAttribute("dir", direction);

      if (rtlBtn) {
        rtlBtn.setAttribute(
          "aria-label",
          isRTL ? "Switch to left to right layout" : "Switch to right to left layout"
        );
        rtlBtn.setAttribute("aria-pressed", String(isRTL));
        rtlBtn.textContent = isRTL ? "LTR" : "RTL";
      }
    }

    const savedTheme =
      safeStorage.get("theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    setTheme(savedTheme);

    const savedDirection = safeStorage.get("direction") || "ltr";
    setDirection(savedDirection);

    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        const newTheme = body.classList.contains("dark") ? "light" : "dark";
        setTheme(newTheme);
        safeStorage.set("theme", newTheme);
      });
    }

    if (rtlBtn) {
      rtlBtn.addEventListener("click", () => {
        const newDirection = html.getAttribute("dir") === "rtl" ? "ltr" : "rtl";
        setDirection(newDirection);
        safeStorage.set("direction", newDirection);
      });
    }
  </script>
</body>
</html>
