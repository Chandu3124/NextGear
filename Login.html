<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NextGear Login</title>

  <link
    rel="icon"
    type="image/png"
    sizes="184x184"
    href="logo-light.png"
  />

  <link rel="stylesheet" href="Login.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
</head>

<body>

  <!-- Page Controls -->
  <div class="page-controls">
    <button
      type="button"
      class="circle-toggle"
      id="rtlToggle"
      aria-label="Toggle RTL mode"
      title="RTL Mode"
    >
      RTL
    </button>

    <button
      type="button"
      class="circle-toggle"
      id="themeToggle"
      aria-label="Toggle dark mode"
      title="Dark Mode"
    >
      <i class="fa-solid fa-moon"></i>
    </button>
  </div>

  <!-- Main Container -->
  <div class="container">
    <div class="form-card">

      <!-- Logo -->
      <div class="logo-wrap">
        <a href="index.html" class="logo" aria-label="NextGear home">
          <img
            id="siteLogo"
            src="logo-light.png"
            alt="NextGear logo"
            data-light-logo="logo-light.png"
            data-dark-logo="logo-dark.png"
          />

          <h2>NEXT<span>GEAR</span></h2>
        </a>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <h2 class="form-title">Student Login</h2>

        <div class="input-box">
          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder=" "
            required
          />
          <label for="loginEmail">Email Address</label>
        </div>

        <div class="input-box">
          <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder=" "
            required
          />
          <label for="loginPassword">Password</label>
        </div>

        <div class="remember-row">
          <label class="remember-me" for="rememberMe">
            <input
              type="checkbox"
              id="rememberMe"
              name="rememberMe"
            />
            <span>Remember me</span>
          </label>

          <a href="#" class="forgot-link" id="forgotPasswordLink">
            Forgot password?
          </a>
        </div>

        <button type="submit" class="main-btn">
          Login
        </button>

        <!-- Login Social Buttons -->
        <div class="social-login">
          <div class="social-divider">
            <span>or continue with</span>
          </div>

          <button
            type="button"
            class="social-btn google-btn"
            id="googleLogin"
            aria-label="Continue with Google"
          >
            <span class="social-icon">G</span>
            Continue with Google
          </button>

          <button
            type="button"
            class="social-btn apple-btn"
            id="appleLogin"
            aria-label="Continue with Apple"
          >
            <span class="social-icon">
              <i class="fa-brands fa-apple"></i>
            </span>
            Continue with Apple
          </button>
        </div>

        <!-- Switch to Signup -->
        <p class="switch">
          New Student?
          <button
            type="button"
            class="switch-btn"
            id="showSignupBtn"
          >
            Create Account
          </button>
        </p>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="hide">
        <h2 class="form-title">Create Account</h2>

        <div class="input-box">
          <input
            type="text"
            id="signupName"
            name="fullName"
            placeholder=" "
            required
          />
          <label for="signupName">Full Name</label>
        </div>

        <div class="input-box">
          <input
            type="email"
            id="signupEmail"
            name="signupEmail"
            placeholder=" "
            required
          />
          <label for="signupEmail">Email Address</label>
        </div>

        <div class="input-box">
          <input
            type="tel"
            id="signupPhone"
            name="phone"
            placeholder=" "
            required
          />
          <label for="signupPhone">Phone Number</label>
        </div>

        <div class="input-box">
          <input
            type="text"
            id="signupLicense"
            name="license"
            placeholder=" "
            required
          />
          <label for="signupLicense">
            Learner License Number
          </label>
        </div>

        <div class="input-box">
          <input
            type="password"
            id="signupPassword"
            name="signupPassword"
            placeholder=" "
            required
          />
          <label for="signupPassword">
            Create Password
          </label>
        </div>

        <button type="submit" class="main-btn">
          Register
        </button>

        <!-- Signup Social Buttons -->
        <div class="social-login">
          <div class="social-divider">
            <span>or continue with</span>
          </div>

          <button
            type="button"
            class="social-btn google-btn"
            id="googleSignup"
            aria-label="Continue with Google"
          >
            <span class="social-icon">G</span>
            Continue with Google
          </button>

          <button
            type="button"
            class="social-btn apple-btn"
            id="appleSignup"
            aria-label="Continue with Apple"
          >
            <span class="social-icon">
              <i class="fa-brands fa-apple"></i>
            </span>
            Continue with Apple
          </button>
        </div>

        <!-- Switch to Login -->
        <p class="switch">
          Already have an account?
          <button
            type="button"
            class="switch-btn"
            id="showLoginBtn"
          >
            Login
          </button>
        </p>
      </form>

    </div>
  </div>

  <script src="Login.js"></script>
</body>
</html>
